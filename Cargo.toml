[package]
name = "primadb"
version = "0.1.1"
edition = "2024"
description = "A Rust-native local-first graph database inspired by Gun."
license = "Apache-2.0"
rust-version = "1.85"

[features]
default = []
crypto = [
    "dep:argon2",
    "dep:chacha20poly1305",
    "dep:ed25519-dalek",
    "dep:getrandom",
    "dep:hkdf",
    "dep:rand_core",
    "dep:x25519-dalek",
]
native-websocket = [
    "dep:futures-util",
    "dep:tokio",
    "dep:tokio-tungstenite",
]
native-webrtc = [
    "native-websocket",
    "dep:webrtc",
]
scripting = [
    "dep:rhai",
]
wasm-threads = [
    "dep:rayon",
    "dep:wasm-bindgen-rayon",
]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-channel = "2.5"
argon2 = { version = "0.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64ct = { version = "1.8", features = ["alloc"] }
blake3 = "1.8"
chacha20poly1305 = { version = "0.10", optional = true }
ed25519-dalek = { version = "2.2", features = ["rand_core"], optional = true }
futures-util = { version = "0.3", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
hkdf = { version = "0.12", optional = true }
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }
rhai = { version = "1.24", default-features = false, features = ["std", "serde"], optional = true }
sha2 = "0.10"
tokio = { version = "1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true }
webrtc = { version = "0.8", optional = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"

[dev-dependencies]
anyhow = "1.0"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
rayon = { version = "1.11", optional = true }
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"], optional = true }
web-sys = { version = "0.3", features = [
    "BinaryType",
    "BroadcastChannel",
    "CloseEvent",
    "DomException",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "IdbDatabase",
    "IdbCursor",
    "IdbCursorWithValue",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "MessageEvent",
    "RtcDataChannel",
    "RtcDataChannelState",
    "RtcDataChannelEvent",
    "RtcConfiguration",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcSdpType",
    "RtcSessionDescriptionInit",
    "Storage",
    "WebSocket",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
