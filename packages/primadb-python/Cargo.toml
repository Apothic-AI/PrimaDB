[package]
name = "primadb-python"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
primadb = { path = "../..", features = ["crypto", "native-websocket", "native-webrtc"] }
pyo3 = { version = "0.28.3", features = ["abi3-py39", "extension-module"] }
pythonize = "0.28.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
