<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrimaDB MoQ Sync</title>
    <link rel="stylesheet" href="./styles.css" />

    <main>
      <p class="eyebrow">primadb package example</p>
      <h1>MoQ Sync Loopback</h1>

      <section class="grid">
        <article>
          <h2>Publisher</h2>
          <pre id="publisher">booting</pre>
        </article>
        <article>
          <h2>Subscriber</h2>
          <pre id="subscriber">booting</pre>
        </article>
        <article>
          <h2>MoQ</h2>
          <pre id="moq">booting</pre>
        </article>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
